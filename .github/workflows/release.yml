name: Publish OpenLine Desk release
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release assets and public update manifest
        shell: pwsh
        run: |
          $source = Get-Content -Raw OpenLineDesk.py
          $match = [regex]::Match($source, 'VERSION = "(\d+\.\d+\.\d+)"')
          if (-not $match.Success) { throw "Could not read VERSION from OpenLineDesk.py" }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/update-manifest.json"
          if ($source -notmatch [regex]::Escape($manifestUrl)) {
            throw "OpenLineDesk.py must point to the public latest-release manifest: $manifestUrl"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; no release needed for this commit."
            exit 0
          }
          $stage = Join-Path $env:RUNNER_TEMP 'OpenLineDesk-release'
          $dist = Join-Path $env:RUNNER_TEMP 'OpenLineDesk-dist'
          New-Item -ItemType Directory -Force $stage, $dist | Out-Null
          Copy-Item OpenLineDesk.py (Join-Path $stage 'OpenLineDesk.py')
          Copy-Item Start-OpenLine.bat, README.md -Destination $stage
          Copy-Item LICENSE (Join-Path $stage 'LICENSE.txt')
          $zip = Join-Path $dist "OpenLineDesk-$version-Windows.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item (Join-Path $stage 'OpenLineDesk.py') (Join-Path $dist 'OpenLineDesk.py')
          $sha = (Get-FileHash (Join-Path $dist 'OpenLineDesk.py') -Algorithm SHA256).Hash.ToLowerInvariant()
          $asset = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/OpenLineDesk.py"
          @{ version = $version; asset_url = $asset; sha256 = $sha } | ConvertTo-Json | Set-Content (Join-Path $dist 'update-manifest.json') -Encoding utf8
          gh release create $tag $zip (Join-Path $dist 'OpenLineDesk.py') (Join-Path $dist 'update-manifest.json') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OpenLine Desk $version" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
